name: Activar notificaciones de reservas

on:
  push:
    paths:
      - ".github/workflows/patch-notifications.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar notificaciones
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('App.tsx')
          s = p.read_text()
          s = s.replace('const {error} = await supabase.from("bookings").insert({', 'const {data:created,error} = await supabase.from("bookings").insert({', 1)
          s = s.replace('      reservation_amount:20\n    });\n    if (error) return Alert.alert("No se pudo reservar",error.message);\n    Alert.alert("Reserva creada","Tu reserva ya está guardada.");', '      reservation_amount:20\n    }).select("id").single();\n    if (error) return Alert.alert("No se pudo reservar",error.message);\n    if (created?.id) {\n      const { error: notifyError } = await supabase.functions.invoke("notify-new-booking", { body: { booking_id: created.id } });\n      if (notifyError) console.warn("No se pudo enviar la notificación de reserva", notifyError.message);\n    }\n    Alert.alert("Reserva creada","Tu reserva ya está guardada.");', 1)
          p.write_text(s)

          p = Path('web/isoana/index.html')
          s = p.read_text()
          s = s.replace("const{error}=await sb.from('bookings').insert({", "const{data:created,error}=await sb.from('bookings').insert({", 1)
          s = s.replace("reservation_amount:20});if(error)return alert('No se pudo reservar: '+error.message);alert('Reserva creada correctamente');", "reservation_amount:20}).select('id').single();if(error)return alert('No se pudo reservar: '+error.message);if(created?.id){const n=await sb.functions.invoke('notify-new-booking',{body:{booking_id:created.id}});if(n.error)console.warn('No se pudo enviar la notificación',n.error.message)}alert('Reserva creada correctamente');", 1)
          p.write_text(s)
          PY

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.tsx web/isoana/index.html
          git rm .github/workflows/patch-notifications.yml
          git commit -m "Conectar reservas con notificaciones push"
          git push
