name: Publicar webs en GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "src/**"
      - "assets/**"
      - "public/**"
      - "docs/**"
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Preparar iconos PWA
        run: |
          mkdir -p public
          cp assets/limpiezas-isoana.png public/logo192.png
          cp assets/limpiezas-isoana.png public/logo512.png

      - name: Compilar Limpiezas Isoana para web
        run: npm run build:web

      - name: Integrar PWA en docs/isoana
        run: |
          rm -rf docs/isoana
          mkdir -p docs/isoana
          cp -R dist/. docs/isoana/
          cp -R web/isoana/. docs/isoana/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/isoana/index.html')
          s = p.read_text()
          tag = '<script type="module" src="./admin-images.js?v=20260905-2"></script>'
          if 'admin-images.js' not in s:
              s = s.replace('</body>', tag + '</body>')
          p.write_text(s)
          PY
          mkdir -p docs/assets
          cp assets/limpiezas-isoana.png docs/assets/limpiezas-isoana.png
          touch docs/.nojekyll

      - name: Publicar docs en gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
