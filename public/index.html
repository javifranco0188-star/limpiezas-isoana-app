<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0B2E59" />
    <meta name="description" content="Limpiezas Isoana · Limpieza profesional en Valencia y alrededores" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="logo192.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #ffffff; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function (error) {
            console.warn('No se pudo registrar el Service Worker:', error);
          });
        });
      }
    </script>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar Limpiezas Isoana.</noscript>
    <div id="root"></div>
  </body>
</html>
